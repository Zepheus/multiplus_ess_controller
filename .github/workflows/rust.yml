name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (host)
    runs-on: ubuntu-latest
    env:
      # The TEST build is kept warning-free; hold that line. (The non-test
      # profile carries test-only-consumed pub API that reads as dead code, so
      # -Dwarnings applies here only.)
      RUSTFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # .cargo/config.toml defaults builds to the ARM device target; tests must
      # run on the host triple (same as local development).
      - name: cargo test
        run: cargo test --target x86_64-unknown-linux-gnu

  device-target:
    name: check (armv7 musl device target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-musleabihf
      - uses: Swatinem/rust-cache@v2
      # check compiles the device target without linking, so no musl cross
      # toolchain is needed in CI.
      - name: cargo check --release
        run: cargo check --release --target armv7-unknown-linux-musleabihf
