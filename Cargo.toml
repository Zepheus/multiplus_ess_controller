[package]
name = "multiplus_ess_controller"
version = "0.1.0"
edition = "2021"
description = "Mode-3 ESS controller for Victron Venus GX — runs our own grid-setpoint loop"

# Native D-Bus via zbus (pure Rust, no libdbus C dependency) so the static musl
# cross-compile stays clean. A persistent system-bus connection replaces the old
# fork+exec-per-call transport. See src/dbus.rs.

[[bin]]
name = "multiplus_ess_controller"
path = "src/main.rs"

[dependencies]
zbus = "5"

[profile.release]
opt-level = "z"     # small binary
lto = true
codegen-units = 1
panic = "abort"     # a panic must not leave us mid-write; abort -> watchdog -> passthru
strip = true
