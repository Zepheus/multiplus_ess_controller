[target.armv7-unknown-linux-musleabihf]
linker = "armv7-unknown-linux-musleabihf-gcc"

[build]
# default to the device target so `cargo build --release` cross-compiles
target = "armv7-unknown-linux-musleabihf"
# Warnings are errors EVERYWHERE — local cargo check/test/clippy and CI alike
# (dependencies are immune via cargo's automatic --cap-lints). Test-only pub
# API is annotated cfg_attr(not(test), allow(dead_code)) at the item.
rustflags = ["-D", "warnings"]
